# Omakase Ruby styling for Rails

AllCops:
  Exclude:
    - spec/enforcement/fixtures/**/*
    - script/ci/fixtures/**/*
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

require:
  - ./script/ci/cops/rafelo/faraday_only_in_upstream_client
  - ./script/ci/cops/rafelo/no_tls_verify_disable
  - ./script/ci/cops/rafelo/config_x_only_in_core
  - ./script/ci/cops/rafelo/cache_only_through_scoped_cache
  - ./script/ci/cops/rafelo/return_to_only_in_value_object
  - ./script/ci/cops/rafelo/env_only_in_config
  - ./script/ci/cops/rafelo/concurrency_only_in_executor
  - ./script/ci/cops/rafelo/current_at_the_edge
  - ./script/ci/cops/rafelo/send_stream_only_in_downloads
  - ./script/ci/cops/rafelo/page_context_through_factory
  - ./script/ci/cops/rafelo/no_permission_literals
  - ./script/ci/cops/rafelo/no_constantize

Rafelo/FaradayOnlyInUpstreamClient:
  Enabled: true
Rafelo/NoTlsVerifyDisable:
  Enabled: true
Rafelo/ConfigXOnlyInCore:
  Enabled: true
Rafelo/CacheOnlyThroughScopedCache:
  Enabled: true
Rafelo/ReturnToOnlyInValueObject:
  Enabled: true
Rafelo/ConcurrencyOnlyInExecutor:
  Enabled: true
Rafelo/CurrentAtTheEdge:
  Enabled: true
  Exclude:
    - spec/**/*
    - engines/*/spec/**/*
Rafelo/SendStreamOnlyInDownloads:
  Enabled: true
Rafelo/PageContextThroughFactory:
  Enabled: true
  Exclude:
    - spec/**/*
    - engines/*/spec/**/*
Rafelo/NoPermissionLiterals:
  Enabled: true
  Exclude:
    - spec/**/*
    - engines/*/spec/**/*
Rafelo/NoConstantize:
  Enabled: true
  Include:
    - engines/**/*.rb
  Exclude:
    - engines/core/**/modules.rb
Rafelo/EnvOnlyInConfig:
  Enabled: true
  Exclude:
    - config/**/*
    - lib/tasks/**/*.rake
    - script/**/*
    - spec/**/*
    - engines/*/spec/**/*
