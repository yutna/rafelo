name: ci
on: [pull_request_target]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: gh pr checkout 123
  ci-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [test]
    steps:
      - run: echo ok
