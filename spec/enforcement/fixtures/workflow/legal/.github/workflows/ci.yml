name: ci
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
  ci-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [test]
    steps:
      - run: echo ok
