---
routes:
- verb: ''
  path: "/cable"
  to: ActionCable::Server::Base
  kind: mount
- verb: GET
  path: "/up"
  to: rails/health#show
  kind: dispatch
- verb: POST
  path: "/core/client_errors"
  to: core/client_errors#create
  kind: dispatch
- verb: POST
  path: "/core/csp_reports"
  to: rafelo/core/csp_reports#create
  kind: dispatch
- verb: GET
  path: "/core/ready"
  to: core/ready#show
  kind: dispatch
- verb: GET
  path: "/core/metrics"
  to: core/metrics#show
  kind: dispatch
- verb: GET
  path: "/:locale/sign_in"
  to: sessions#new
  kind: dispatch
- verb: POST
  path: "/:locale/sign_in"
  to: sessions#create
  kind: dispatch
- verb: DELETE
  path: "/:locale/sign_out"
  to: sessions#destroy
  kind: dispatch
- verb: DELETE
  path: "/:locale/sign_out_everywhere"
  to: sessions#destroy_all
  kind: dispatch
- verb: GET
  path: "/:locale"
  to: home#show
  kind: dispatch
