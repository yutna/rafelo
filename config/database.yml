<% production_password = if Rails.env.production?
     ENV["DB_PASSWORD"].presence || Rails.application.credentials.dig(:database, :password)
   else
     ENV.fetch("DB_PASSWORD", "postgres")
   end %>
<% migration_password = if Rails.env.production?
     ENV["DB_MIGRATION_PASSWORD"].presence || ENV["DB_PASSWORD"].presence || Rails.application.credentials.dig(:database, :migration_password)
   else
     ENV.fetch("DB_MIGRATION_PASSWORD", production_password)
   end %>
<% raise "database password is missing from the production credentials" if Rails.env.production? && production_password.blank? %>
<% raise "migration database password is missing from the production credentials" if Rails.env.production? && migration_password.blank? %>
<% migration_role = ENV.fetch("RAFELO_DATABASE_ROLE", "runtime") == "migration" %>
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 }.to_i + 4 + 2 + 1 %> # Puma threads, executor, downloads, polling
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= production_password %>

development:
  <<: *default
  database: rafelo_development

test:
  <<: *default
  database: rafelo_test<%= ENV["TEST_ENV_NUMBER"] %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "rafelo_production") %>
    username: <%= migration_role ? ENV.fetch("DB_MIGRATION_USER", "rafelo_migrator") : ENV.fetch("DB_USER", "rafelo") %>
    password: <%= migration_role ? migration_password : production_password %>
  migration:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "rafelo_production") %>
    username: <%= ENV.fetch("DB_MIGRATION_USER", "rafelo_migrator") %>
    password: <%= migration_password %>
    database_tasks: false
