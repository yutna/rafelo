default: &default
  store_options:
    # Cap the age of the oldest cache entry so cache rows cannot live forever
    # (OPS-07). Size still bounds memory and disk.
    max_age: <%= 30.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
