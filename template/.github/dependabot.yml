version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope # -> "chore(deps): bump ...", which passes the PR title check

  # One dependency per pull request. Peer-set groups are added only for the
  # sets WF-06 names, when those packages enter the frontend stack.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
