name: pr-check
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft,
            assigned, unassigned, milestoned, demilestoned, labeled, unlabeled]
permissions:
  contents: read
jobs:
  pr-check:
    uses: yutna/oss-kit/.github/workflows/pr-check.yml@11a95f398a14797d99cfdcb1ffef2c2c8ea355ba # main
    permissions:
      contents: read
      pull-requests: write
      issues: write
