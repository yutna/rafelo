name: release
on:
  milestone:
    types: [closed]
permissions:
  contents: read
jobs:
  release:
    uses: yutna/oss-kit/.github/workflows/release.yml@11a95f398a14797d99cfdcb1ffef2c2c8ea355ba # main
    permissions:
      contents: write
      issues: write
    with:
      preflight: |
        grep -qx "$VERSION" VERSION
        test -d "spec/fixtures/formats/v$VERSION" || { echo "missing formats fixture for v$VERSION"; exit 1; }
