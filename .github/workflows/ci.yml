name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
    # Temporary, removed by #1095: prove the scheduled gate on the current
    # main without waiting for the next daily run.
    - cron: "*/15 * * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUNDLE_FROZEN: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "*"

jobs:
  image:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ref: ${{ steps.read.outputs.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the prebuilt Dev Container reference
        id: read
        run: echo "ref=$(cat .devcontainer/image_digest)" >> "$GITHUB_OUTPUT"
  affected:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: image
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      app: ${{ steps.select.outputs.app }}
      engines: ${{ steps.select.outputs.engines }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select affected applications and engines
        id: select
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            script/ci/affected --all
            script/ci/affected --all --format github >> "$GITHUB_OUTPUT"
          else
            script/ci/affected --base HEAD^1
            script/ci/affected --format github --base HEAD^1 >> "$GITHUB_OUTPUT"
          fi

  lockfile:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected]
    if: needs.affected.outputs.mode == 'lockfile'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gems
        run: bundle check || bundle install

      - name: Install npm dependencies
        run: npm ci

      - name: Audit gems
        run: bin/bundler-audit

      - name: Audit npm packages
        run: script/ci/npm_audit

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Prepare database
        env:
          RAILS_ENV: test
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: bin/rails db:prepare

      - name: Run the app smoke suite
        env:
          RAILS_ENV: test
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: script/ci/e2e --project app

  actionlint:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash -o /tmp/actionlint.sh
          bash /tmp/actionlint.sh 1.7.12
          ./actionlint -color

  scan_ruby:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gems
        run: bundle check || bundle install

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install npm dependencies
        run: npm ci

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: script/ci/npm_audit

      - name: Check the npm audit canary
        run: script/ci/npm_audit_canary

  lint:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 10
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gems
        run: bundle check || bundle install

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Lint - ESLint and Prettier
        run: npm run lint

      - name: Lint - Prettier
        run: npm run format:check

      - name: Lint - canaries
        run: script/ci/eslint_canary

      - name: Lint - @apply
        run: script/ci/apply_check

      - name: Lint - @apply canary
        run: script/ci/apply_check_canary

  test:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected]
    if: needs.affected.outputs.mode != 'lockfile'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # script/ci/release --check reads the local v* tags (WF-05)

      - name: Install gems
        run: bundle check || bundle install

      - name: Install npm dependencies
        run: npm ci

      - name: Check contracts
        run: |
          npm run contracts:check
          npm run errors:check
          npm run i18n:check

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Check the frontend architecture
        run: npm run arch:check

      - name: Check generated graph and aliases
        run: |
          script/ci/engine_graph --check
          npm run aliases:check

      - name: Check documentation
        run: |
          npm run docs:check
          npm run docs:canary

      - name: Check the release version
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: script/ci/release_check

      - name: Check frontend boundaries
        run: |
          script/ci/frontend_boundary
          script/ci/page_props

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Prepare the test database
        if: needs.affected.outputs.app == 'true' || needs.affected.outputs.engines != ''
        env:
          RAILS_ENV: test
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: bin/rails db:prepare

      - name: Run tests
        if: needs.affected.outputs.app == 'true'
        env:
          RAILS_ENV: test
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: script/ci/rspec

      - name: Run engine specs
        if: needs.affected.outputs.engines != ''
        env:
          RAILS_ENV: test
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          AFFECTED_ENGINES: ${{ needs.affected.outputs.engines }}
        run: script/ci/engine_specs

  guards:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gems
        run: bundle check || bundle install

      - name: Install npm dependencies
        run: npm ci

      - name: Check runtime and package pins
        run: script/ci/pins

      - name: Check GitHub Actions pins
        run: script/ci/actions_pinned

      - name: Check workflow policy
        run: script/ci/workflow_policy

      - name: Check production routes
        run: |
          script/ci/production_routes
          script/ci/production_routes_canary

      - name: Check the Packwerk cycle canary
        run: script/ci/packwerk_canary

      - name: Check the graph canaries
        run: script/ci/graph_canaries

      - name: Check affected selection
        run: |
          script/ci/affected_canary
          script/ci/fan_in_canary

      - name: Check growth and fan-in
        run: |
          script/ci/growth
          script/ci/fan_in
          script/ci/growth_canary

      - name: Check cross-engine clones
        run: |
          script/ci/clones
          script/ci/clones_canary

  canaries:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gems
        run: bundle check || bundle install

      - name: Install npm dependencies
        run: npm ci

      - name: Run enforcement canaries
        run: script/ci/enforcement_canaries

      - name: Run the pull request and release canaries
        run: |
          script/ci/title_canary
          script/ci/ratchet_canary
          script/ci/guard_approval_canary
          script/ci/repo_rules_canary
          script/ci/release_canary
          script/ci/adoption_needed_canary

      - name: Run the supervisor canary
        run: script/ci/supervisor_canary

      - name: Run the deploy preflight and its canary
        run: |
          script/ci/deploy_preflight
          script/ci/deploy_preflight_canary

      - name: Check test skips
        run: script/ci/skips

      - name: Check test selectors
        run: script/ci/test_selectors

      - name: Check boundary cops
        run: script/ci/cops_canary

  concurrency:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected]
    if: needs.affected.outputs.mode != 'lockfile'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gems
        run: bundle check || bundle install

      - name: Run concurrency specs
        env:
          RAILS_ENV: test
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: script/ci/concurrency

  e2e:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected]
    if: needs.affected.outputs.mode != 'lockfile'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gems
        run: bundle check || bundle install

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare database
        env:
          RAILS_ENV: test
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: bin/rails db:prepare

      - name: Run design-system e2e
        shell: bash
        env:
          RAILS_ENV: test
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          AFFECTED_MODE: ${{ needs.affected.outputs.mode }}
          AFFECTED_APP: ${{ needs.affected.outputs.app }}
          AFFECTED_ENGINES: ${{ needs.affected.outputs.engines }}
        run: |
          args=()
          if [ "$AFFECTED_MODE" = "narrow" ]; then
            args=(--project design_system)
          elif [ "$AFFECTED_APP" = "true" ] && [ -z "$AFFECTED_ENGINES" ]; then
            args=(--project app)
          elif [ "$AFFECTED_APP" = "false" ] && [ -n "$AFFECTED_ENGINES" ]; then
            IFS=',' read -ra names <<< "$AFFECTED_ENGINES"
            for name in "${names[@]}"; do
              if find "engines/$name/e2e" -type f -name '*.spec.ts' -print -quit | grep -q .; then
                args+=(--project "$name")
              fi
            done
            if [ "${#args[@]}" -eq 0 ]; then
              echo "affected: no engine e2e projects"
              exit 0
            fi
          fi
          script/ci/e2e "${args[@]}"

  examples-removable:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected]
    if: needs.affected.outputs.mode != 'lockfile'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gems
        run: bundle check || bundle install

      - name: Install npm dependencies
        run: npm ci

      - name: Remove examples and run the gate
        run: script/ci/example_removal

  adoption-needed:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 5
    outputs:
      current: ${{ steps.decide.outputs.current }}
      update: ${{ steps.decide.outputs.update }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide which adoption proofs run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: script/ci/adoption_needed

  adoption:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected, adoption-needed]
    if: needs.adoption-needed.outputs.current == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gems
        run: bundle check || bundle install

      - name: Adopt the commit under test and run its gate
        run: script/ci/adoption current

  adoption-update:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected, adoption-needed]
    if: needs.adoption-needed.outputs.update == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gems
        run: bundle check || bundle install

      - name: Adopt N-1 and update it to this release
        run: script/ci/adoption update

  production-image-needed:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether the production image build runs
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: |
          set -euo pipefail
          run=false
          reason="skip: no production image inputs changed"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run=true
            reason="run: $EVENT_NAME"
          elif [ -n "$BASE_SHA" ]; then
            if ! changed=$(git diff --name-only "$BASE_SHA" HEAD); then
              run=true
              reason="run: cannot read the change set"
            elif echo "$changed" | grep -Eq '^(Dockerfile|\.dockerignore|Gemfile|Gemfile\.lock|package(-lock)?\.json|.*\.gemspec|\.env\.ci\.production|config/credentials/dummy\.(key|yml\.enc)|config/application\.rb|config/environments/production\.rb|config/storage\.yml|config/database\.yml|config/initializers/active_record_encryption\.rb|\.github/workflows/ci\.yml)$'; then
              run=true
              reason="run: production image inputs changed"
            fi
          else
            run=true
            reason="run: no base to compare"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$reason"

  production-image:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected, production-image-needed]
    if: needs.production-image-needed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUNDLE_FROZEN: "false" # the throwaway module changes Gemfile.lock (OPS-06)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          # setup-node v7 auto-caches the package manager via `npm config get
          # cache`; the npm bundled with Node 26.13.0 (11.20.0) fails the repo's
          # devEngines check (requires npm 12.2.2, onFail: error). Disabled
          # here; the next step pins npm@12.2.2.
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@12.2.2

      - name: Install npm dependencies
        run: npm ci

      - name: Create a throwaway module
        run: bin/rails generate rafelo:module image_check

      - name: Write throwaway production credentials
        # The final image is booted with real (throwaway) credentials, not the
        # dummy-boot flag. The key and values are generated here, never printed
        # or committed (BE-08, SEC-07). The file lives outside the workspace so
        # the tracked config/credentials/production.yml.enc is never overwritten
        # (#432); the boot steps mount it into the container.
        run: |
          set -euo pipefail
          key="$(bundle exec ruby -rsecurerandom -e 'puts SecureRandom.hex(16)')"
          echo "::add-mask::$key"
          printf '%s' "$key" > /tmp/rafelo-production.key
          bundle exec ruby -ractive_support -ractive_support/encrypted_configuration -rsecurerandom -ryaml -e '
            config = ActiveSupport::EncryptedConfiguration.new(
              config_path: "/tmp/rafelo-production.yml.enc",
              key_path: "/tmp/rafelo-production.key",
              env_key: "RAILS_MASTER_KEY",
              raise_if_missing_key: true
            )
            config.write({
              "secret_key_base" => SecureRandom.hex(64),
              "active_record_encryption" => {
                "primary_key" => SecureRandom.hex(16),
                "deterministic_key" => SecureRandom.hex(16),
                "key_derivation_salt" => SecureRandom.hex(16)
              },
              "database" => { "password" => "postgres", "migration_password" => "postgres" },
              "aws" => { "access_key_id" => "dummy", "secret_access_key" => "dummy" }
            }.to_yaml)
          '
          chmod 0644 /tmp/rafelo-production.yml.enc

      - name: Build the production image
        run: docker build -t rafelo-ci .

      - name: Verify the tracked production credentials are untouched
        # The boot credentials stay in /tmp; the repository's placeholder file
        # must come out of the job exactly as it went in (#432, BE-08).
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- config/credentials)"
          git diff --exit-code -- config/credentials/production.yml.enc

      - name: Check psql in the image
        # schema_format :sql loads structure.sql with psql at boot and restore (C2, OPS-06).
        run: docker run --rm rafelo-ci psql --version

      - name: Prepare the image database
        # Load structure.sql with the image's psql as the migration role, as the
        # entrypoint does on the first deploy (C2, BE-22).
        run: |
          set -euo pipefail
          key="$(cat /tmp/rafelo-production.key)"
          docker run --rm --network host \
            -v /tmp/rafelo-production.yml.enc:/rails/config/credentials/production.yml.enc:ro \
            -e RAILS_ENV=production \
            -e RAILS_MASTER_KEY="$key" \
            -e RAILS_HOSTS=localhost \
            -e ACME_API_BASE_URL=http://127.0.0.1:9 \
            -e ACTIVE_STORAGE_SERVICE=local \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=rafelo_boot \
            -e DB_USER=postgres -e DB_PASSWORD=postgres \
            -e DB_MIGRATION_USER=postgres -e DB_MIGRATION_PASSWORD=postgres \
            -e ACME_DATABASE_ROLE=migration \
            rafelo-ci ./bin/rails db:prepare

      - name: Boot the production image and check /up
        # A production-image build is not a boot: C5 changes the server gem, and
        # C3/C4 change the production boot. Start the image's Rails server (Puma)
        # and wait for the health endpoint (OPS-06).
        run: |
          set -euo pipefail
          key="$(cat /tmp/rafelo-production.key)"
          docker run -d --name rafelo-boot --network host \
            -v /tmp/rafelo-production.yml.enc:/rails/config/credentials/production.yml.enc:ro \
            -e RAILS_ENV=production \
            -e RAILS_MASTER_KEY="$key" \
            -e RAILS_HOSTS=localhost \
            -e ACME_API_BASE_URL=http://127.0.0.1:9 \
            -e ACTIVE_STORAGE_SERVICE=local \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=rafelo_boot \
            -e DB_USER=postgres -e DB_PASSWORD=postgres \
            -e DB_MIGRATION_USER=postgres -e DB_MIGRATION_PASSWORD=postgres \
            rafelo-ci ./bin/rails server -b 0.0.0.0 -p 8080
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/up >/dev/null 2>&1; then
              echo "production image booted and answered /up (Puma)"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' rafelo-boot 2>/dev/null | grep -q true; then
              break
            fi
            sleep 2
          done
          echo "production image failed to boot" >&2
          docker logs rafelo-boot >&2 || true
          exit 1

      - name: Remove the boot container
        if: always()
        run: docker rm -f rafelo-boot 2>/dev/null || true

  smoke-needed:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected]
    if: needs.affected.outputs.mode != 'lockfile'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether generator smoke runs
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: |
          set -euo pipefail
          run=false
          reason="skip: no generator/core/registry/routes changes"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run=true
            reason="run: $EVENT_NAME"
          elif [ -n "$BASE_SHA" ]; then
            if ! changed=$(git diff --name-only "$BASE_SHA" HEAD); then
              run=true
              reason="run: cannot read the change set"
            elif echo "$changed" | grep -Eq '^(engines/core/lib/generators/|engines/core/app/.*/core/(modules|registry|page_context|urls|page_props)|engines/core/app/frontend/contracts/|engines/core/app/models/rafelo/core/page_props\.rb|config/routes\.rb|engines/.*/config/routes\.rb|script/ci/generator_smoke)'; then
              run=true
              reason="run: triggering paths changed"
            fi
          else
            run=true
            reason="run: no base to compare"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$reason"

  generator-smoke:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected, smoke-needed]
    if: needs.affected.outputs.mode != 'lockfile' && needs.smoke-needed.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gems
        run: bundle check || bundle install

      - name: Install npm dependencies
        run: npm ci

      - name: Run generator smoke
        env:
          RAILS_ENV: test
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: script/ci/generator_smoke

  gate:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: [image, affected]
    if: needs.affected.outputs.mode != 'lockfile'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # bin/ci requires config/boot before its own Setup step runs, so the
      # bundle must exist first.
      - name: Install gems
        run: bundle check || bundle install

      - name: Run the gate
        run: bin/ci

  touch-rate:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs: image
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Open an issue above the touch-rate budget
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: script/ci/touch_rate --open-issue

  ci-ok:
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    if: always()
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    needs:
      [
        image,
        affected,
        lockfile,
        actionlint,
        scan_ruby,
        scan_js,
        lint,
        guards,
        canaries,
        test,
        gate,
        examples-removable,
        adoption,
        adoption-needed,
        adoption-update,
        concurrency,
        e2e,
        production-image-needed,
        production-image,
        smoke-needed,
        generator-smoke,
        touch-rate,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
